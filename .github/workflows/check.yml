name: Royal Banquet Checker

on:
  schedule:
    - cron: '*/10 * * * *'   # every 10 minutes
  workflow_dispatch:          # lets you click "Run workflow" manually to test

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install requests

      - name: Run availability check
        env:
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          NOTIFY_EMAIL: ${{ secrets.NOTIFY_EMAIL }}
        run: python royal_banquet_checker.py

      - name: Save "already seen" state back to the repo
        run: |
          git config user.name "royal-banquet-bot"
          git config user.email "actions@github.com"
          git add seen_slots.json
          git diff --staged --quiet || git commit -m "Update seen slots"
          git push

